name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # A runner has no harness, which is exactly the state every host-dependent check
      # is supposed to skip in. Saying so explicitly makes that path deterministic
      # instead of accidental — and it means a future test that forgets its skip guard
      # fails here, on purpose, rather than on a user's machine that has no DSH either.
      DSH_TEST_HOST: none
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The suite needs no install: it has no dependencies. A DSH installation is
      # optional too — the checks that exercise the real host contract locate one if
      # it is present and skip if it is not, so this matrix stays honest on a runner
      # that has no harness.
      - run: npm test
      # Non-fatal without a host: this still validates the declared range, the
      # `dsh.engines.dsh` mirror, the peer declarations and compatibility.json, which
      # are the parts that need no harness. It used to exit 1 here and fail the job.
      - run: node scripts/check-compat.mjs

  # The bare-checkout job above can only ever prove that the host-dependent checks SKIP.
  # This one installs the published harness at the version this build declares, so the
  # same suite runs against the real contract with nothing skipped — which is the
  # guarantee that actually matters for a plugin other people install.
  against-dsh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      # `findDshInstall()` probes beside the running node, which is exactly where a
      # global install lands, so no extra wiring is needed for the checks to find it.
      - run: npm install -g @deepseek-ai/dsh@0.1.5-rc.1
      - run: npm test
      - run: node scripts/check-compat.mjs
